project:
  type: book
  output-dir: _book

book:
  title: "Pythonによるデータ可視化"
  subtitle: "初めての人向け・90分×8コマ"
  author: "薗田 光太郎"
  date: "2026年11月14日（土）・15日（日）"
  chapters:
    - index.qmd
    - part: "1日目"
      chapters:
        - session1.qmd
        - session2.qmd
        - session3.qmd
        - session4.qmd
    - part: "2日目"
      chapters:
        - session5.qmd
        - session6.qmd
        - session7.qmd
        - session8.qmd
  appendices:
    - appendix_terms.qmd
    - appendix_trouble.qmd

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
  pdf:
    toc: true
    toc-depth: 3
    number-sections: true
    linestretch: 1.0
    indent: true
    papersize: a4
    pdf-engine: lualatex
    latex-auto-install: false
    documentclass: ltjsbook
    classoption: [a4paper, 12pt, lualatex, ja=standard]
    include-in-header:
      text: |
        \usepackage{luatexja}
        \usepackage{luatexja-fontspec}
        \usepackage[deluxe,ipaex]{luatexja-preset}
        \usepackage{physics}
        \usepackage{fvextra}
        \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines=true,breakanywhere=true,commandchars=\\\{\}}
        \DefineVerbatimEnvironment{verbatim}{Verbatim}{breaklines=true,breakanywhere=true}
        \AtBeginDocument{\date{2026年11月14日（土）・15日（日）}}
        \usepackage{imakeidx}
        \makeindex[intoc=true, columns=3, columnseprule=true, options=-s latex/indexstyles.ist]
        \makeatletter
        \renewcommand{\maketitle}{%
          \begin{titlepage}%
            \begin{center}%
              \vspace*{2cm}%
              {\large 専門科目：情報\par}%
              \vspace{2cm}%
              {\Huge\bfseries Pythonによるデータ可視化\par}%
              \vspace{1.2cm}%
              {\large 初めての人向け・90分×8コマ\par}%
              \vspace{2.5cm}%
              {\large 長崎大学病院 医療情報部\quad 薗田 光太郎\par}%
              \vspace{0.7cm}%
              {\large 放送大学 長崎学習センター\par}%
              \vfill
              {\large \@date\par}%
              \vspace*{1.5cm}%
            \end{center}%
          \end{titlepage}%
        }
        \makeatother
        \usepackage{fancyhdr}
        \fancypagestyle{plain}{%
          \fancyhf{}%
          \renewcommand{\headrulewidth}{0pt}%
          \renewcommand{\footrulewidth}{0pt}%
          \fancyfoot[C]{{\footnotesize 本資料（画像を含む）の無断転載・無断使用は禁止します．}\\[0.6em]\thepage}%
        }
        \fancypagestyle{plainhead}{%
          \fancyhf{}%
          \renewcommand{\headrulewidth}{0pt}%
          \renewcommand{\footrulewidth}{0pt}%
          \fancyhead[RO]{\textbf{\thepage}}%
          \fancyhead[LE]{\textbf{\thepage}}%
          \fancyfoot[C]{{\footnotesize 本資料（画像を含む）の無断転載・無断使用は禁止します．}}%
        }
        \fancypagestyle{plainfoot}{%
          \fancyhf{}%
          \renewcommand{\headrulewidth}{0pt}%
          \renewcommand{\footrulewidth}{0pt}%
          \fancyfoot[C]{{\footnotesize 本資料（画像を含む）の無断転載・無断使用は禁止します．}\\[0.6em]\thepage}%
        }
    include-after-body:
      text: |
        \printindex

lang: ja

execute:
  echo: true
  warning: false
